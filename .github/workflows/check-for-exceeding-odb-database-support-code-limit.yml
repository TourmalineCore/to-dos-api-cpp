# In cases where a project’s source code is closed, the ODB library 
# license affects the project’s license. If the limit of 10,000 lines 
# of database support code is exceeded, it is no longer possible to use 
# the FPL license; in that case, you must either purchase the CPL 
# or make the project’s source code open source.

# More details here: https://www.codesynthesis.com/products/odb/license.xhtml

# This workflow will succeed if the ODB database support code 
# (.ixx, .cxx, .hxx) has not reached the limit, and will fail otherwise.

name: Check for exceeding the odb database support code limit

on:
  pull_request:
    types: [opened, synchronize]
  push:
    branch:
      - master
      - feature/* # Added for debugging; Must be remove before merging it to master

env:
  ODB_VERSION: 2.5.0
  ODB_OS_BUILD: ubuntu24.04
jobs:
  verify-that-database-support-code-limit-has-not-been-exceeded:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout the repo
        uses: actions/checkout@v4
        
      - name: Download and install odb compiler
        run: |
          curl -fsSL -o odb.deb "https://www.codesynthesis.com/download/odb/${ODB_VERSION}/ubuntu/${ODB_OS_BUILD}/x86_64/odb_${ODB_VERSION}-0~${ODB_OS_BUILD}_amd64.deb"
          sudo apt-get install -y ./odb.deb
          odb --version | grep -q "No such file or directory" && exit 1 || exit 0
      
      - name: Install Conan
        run: |
          pip install Conan
          conan --version | grep -q "Conan version" && exit 0 || exit 1
      
      - name: Generate Conan default profile
        run: conan profile detect
      
      - name: Setup local recipes index for Conan
        run: conan remote add local-recipes ./deps --type=local-recipes-index
      
      - name: Download and build libodb and libdb-pgsql via Conan
        run: conan install --requires=libodb/2.5.0 --requires=libodb-pgsql/2.5.0 --build=missing --deployer=full_deploy --output-folder=.odb-deps
      
      - name: Check the limit
        run: |
          odb \
            --show-sloc --sloc-limit 10000 -d pgsql --std c++20 \
            -I ./.odb-deps/host/libodb/2.5.0/Debug/x86_64/include \
            -I ./.odb-deps/host/libodb-pgsql/2.5.0/Debug/x86_64/include \
            ./src/core/to-do.h 2>&1 | grep "total:" | sed 's/[^0-9]*//g'
      
